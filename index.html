<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/primeflex@latest/primeflex.css"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body class="bg-gray-900">
    <main class="main-height">
      <div
        class="container flex align-items-center justify-content-center h-full"
      >
        <div
          class="content p-5 border-round-2xl bg-gray-800 flex flex-column align-items-center justify-content-center"
        >
          <img
            class="border-circle w-5rem"
            src="./assets/images/avatar-jessica.jpeg"
            alt="avatar-jessica"
            srcset=""
          />
          <h1 class="m-0">Jessica Randall</h1>
          <p class="green">London, United Kingdom</p>
          <p>"Front-end developer and avid reader."</p>
          <button
            type="button"
            class="w-full bg-gray-700 p-2 m-2 t-white border-round-xl"
          >
            GitHub
          </button>

          <button
            type="button"
            class="w-full bg-gray-700 p-2 m-2 t-white border-round-xl"
          >
            Frontend Mentor
          </button>
          <button
            type="button"
            class="w-full bg-gray-700 p-2 m-2 t-white border-round-xl"
          >
            LinkedIn
          </button>
          <button
            type="button"
            class="w-full bg-gray-700 p-2 m-2 t-white border-round-xl"
          >
            Twitter
          </button>
          <button
            type="button"
            class="w-full bg-gray-700 p-2 m-2 t-white border-round-xl"
          >
            Instagram
          </button>
        </div>
      </div>
    </main>

    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Yahia Mohammed Abdelrahman</a>.
      </div>
    </footer>
  </body>
</html>
